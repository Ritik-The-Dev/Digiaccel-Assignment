# Deploys the React client only. The API lives on Render (see render.yaml).
# Set VITE_API_URL in Netlify → Site settings → Environment variables.
[build]
  base = "client"
  command = "npm install && npm run build"
  publish = "dist"

# Single-page app: every unknown path is served by index.html so React Router
# can handle /tasks and /onboarding on a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
